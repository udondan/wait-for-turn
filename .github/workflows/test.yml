---
name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on the Ubuntu runners.
      - name: Lint wait.sh
        run: shellcheck wait.sh

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [shellcheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
