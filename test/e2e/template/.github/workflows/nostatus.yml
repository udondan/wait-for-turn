# Uses the action directly, not the reusable workflow, with status-context set
# but without statuses: write. The action has to warn and wait without the
# commit status. Only runs while the variable NOSTATUS is true.
name: No status

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  wait-for-turn:
    if: vars.NOSTATUS == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    concurrency:
      group: nostatus-wait-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: udondan/wait-for-turn@__ACTION_REF__ # zizmor: ignore[unpinned-uses] the ref under test
        with:
          poll-interval-seconds: ${{ vars.POLL || '10' }}
          queued-poll-interval-seconds: ${{ vars.QUEUED_POLL || '30' }}
          timeout-minutes: 30
          status-context: wait-for-turn-nostatus

  deploy:
    needs: wait-for-turn
    if: ${{ !cancelled() && vars.NOSTATUS == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check turn
        if: needs.wait-for-turn.result != 'success'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use resource
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SECONDS_TO_USE: ${{ vars.DEPLOY_SECONDS || '60' }}
        run: exec bash scripts/use-resource.sh nostatus "$SECONDS_TO_USE"
