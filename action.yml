name: Wait for turn
description: Wait until all earlier active runs of the same workflow have finished
author: udondan
branding:
  icon: clock
  color: blue

inputs:
  workflow:
    description: Workflow file name to queue on. Defaults to the workflow of the current run.
    required: false
    default: ''
  poll-interval-seconds:
    description: Seconds between checks.
    required: false
    default: '30'
  timeout-minutes:
    description: Fail after waiting this many minutes. 0 waits indefinitely.
    required: false
    default: '0'
  require-up-to-date:
    description: >-
      Fail if the pull request branch is behind its base branch. Checked before,
      while and after waiting, so an outdated run stops right away and frees the
      queue. Only applies to pull_request events.
    required: false
    default: 'false'
  token:
    description: Token with actions:read and contents:read permission.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Wait for earlier runs to finish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        INPUT_REQUIRE_UP_TO_DATE: ${{ inputs.require-up-to-date }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$GITHUB_ACTION_PATH/wait.sh"
